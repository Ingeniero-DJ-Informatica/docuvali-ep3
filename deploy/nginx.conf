# Proxy inverso con TLS: todo el tráfico externo viaja cifrado (HTTPS)
limit_req_zone $binary_remote_addr zone=por_ip:10m rate=100r/s;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/docuvali.crt;
    ssl_certificate_key /etc/nginx/certs/docuvali.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / { return 302 /dashboard/; }

    location ~ ^/(api/|docs|redoc|openapi.json|health) {
        limit_req zone=por_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /dashboard/ {
        # El dashboard es la pantalla interna de los revisores: pide usuario y contraseña.
        # La API no lo necesita porque ya exige la clave X-API-Key.
        auth_basic "DocuVali - acceso de revisores";
        auth_basic_user_file /etc/nginx/certs/.htpasswd;
        proxy_pass http://dashboard:8501/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # Streamlit usa WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
